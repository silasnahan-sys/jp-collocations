name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # golden suites import .ts directly (type stripping)
      - run: npm ci
      - run: npm run build
      - run: npm run golden
      - run: npm run lint
